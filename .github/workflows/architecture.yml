name: Architecture

# The cheap gate for the app's layering rules (docs/architecture.md, section
# 11): imports per layer, no direct clock reads, adapters built only in the
# composition root, no context dependency cycles. Seconds on Linux.

on:
  push:
    branches: ['**', '!gh-pages', '!pr-media']
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Layering rules
    # Fork PRs only; a same-repo PR's commits are checked by their push.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check-architecture.py
